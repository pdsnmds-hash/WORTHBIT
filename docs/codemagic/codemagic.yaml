# Ordinary signed AAB build. Enable only AFTER uploading the cloud-generated JKS.
workflows:
  worthbit-aab:
    name: WorthBit - Signed AAB
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      java: 17
      android_signing:
        - worthbit_upload
    cache:
      cache_paths:
        - $HOME/.gradle/caches/modules-2
        - $HOME/.gradle/wrapper
    scripts:
      - name: Audit checkout
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          python3 docs/codemagic/audit_repository.py
      - name: Configure exact Android SDK packages
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          python3 docs/codemagic/configure_sdk.py
      - name: Connect uploaded signing identity to Gradle
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          python3 docs/codemagic/prepare_signing.py
      - name: Test, lint and build signed AAB
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:bundleRelease
      - name: Verify AAB signature, identity and four ABIs
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          python3 docs/codemagic/verify_aab.py app/build/outputs/bundle/release/app-release.aab
    artifacts:
      - app/build/outputs/bundle/release/*.aab
      - app/build/reports/lint-results-debug.html
      - app/build/reports/tests/testDebugUnitTest/**
